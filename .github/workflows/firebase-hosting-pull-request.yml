name: Deploy to Firebase Hosting PR Previews
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 1. BUILD FOR DEV TARGETS
      # ==========================================
      - name: Build Dev Preview
        if: github.base_ref == 'dev'
        run: npm run build:dev
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_DEV_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_DEV_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_DEV_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_DEV_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_DEV_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_DEV_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_DEV_APP_ID }}

      # ==========================================
      # 2. BUILD FOR MAIN TARGETS
      # ==========================================
      - name: Build Production Preview
        if: github.base_ref == 'main'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_PROD_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_PROD_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_PROD_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_PROD_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_PROD_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_PROD_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_PROD_APP_ID }}

      # ==========================================
      # 3. DEPLOYMENT STEPS
      # ==========================================

      # If PR is targeting the dev branch, spin up a preview on the DEV project
      - name: Deploy Preview to Dev Project
        if: github.base_ref == 'dev'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARITE_VIDALES_DEV }}
          projectId: ${{ secrets.VITE_DEV_PROJECT_ID }}

      # If PR is targeting the main branch, spin up a preview on the PROD project
      - name: Deploy Preview to Production Project
        if: github.base_ref == 'main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARITE_VIDALES_PROD }}
          projectId: ${{ secrets.VITE_PROD_PROJECT_ID }}
